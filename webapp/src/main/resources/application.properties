# ─── Default Datasource (bridge + webapp) ───────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/iot
quarkus.datasource.username=iot
quarkus.datasource.password=iot

# Hibernate ORM — bridge and webapp entities
quarkus.hibernate-orm.packages=io.casehub.iot.bridge.persistence.jpa,io.casehub.iot.webapp.app.persistence
quarkus.hibernate-orm.mapping.format.global=ignore

# Flyway — bridge audit + webapp tables
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/iot-bridge/migration,classpath:db/iot-webapp/migration,classpath:db/cbr/migration

# ─── iot-work Datasource (work + ledger) ────────────────────────────────────
quarkus.datasource.iot-work.db-kind=postgresql
quarkus.datasource.iot-work.jdbc.url=jdbc:postgresql://localhost:5432/iot
quarkus.datasource.iot-work.username=iot
quarkus.datasource.iot-work.password=iot

# Hibernate ORM — work runtime model
quarkus.hibernate-orm.iot-work.datasource=iot-work
quarkus.hibernate-orm.iot-work.packages=io.casehub.work.runtime.model

# Flyway — work + ledger migrations (non-overlapping versions)
quarkus.flyway.iot-work.migrate-at-start=true
quarkus.flyway.iot-work.locations=classpath:db/work/migration,classpath:db/ledger/migration

# ─── iot-ras Datasource (RAS isolated) ───────────────────────────────────────
quarkus.datasource.iot-ras.db-kind=postgresql
quarkus.datasource.iot-ras.jdbc.url=jdbc:postgresql://localhost:5432/iot
quarkus.datasource.iot-ras.username=iot
quarkus.datasource.iot-ras.password=iot

# Hibernate ORM — RAS situation entities
quarkus.hibernate-orm.iot-ras.datasource=iot-ras
quarkus.hibernate-orm.iot-ras.packages=io.casehub.ras.persistence.jpa

# Flyway — RAS situation context tables
quarkus.flyway.iot-ras.migrate-at-start=true
quarkus.flyway.iot-ras.locations=classpath:db/ras/migration

# ─── Engine in-memory persistence (standalone mode) ──────────────────────────
quarkus.arc.selected-alternatives=io.casehub.persistence.memory.*

# ─── IoT Providers ───────────────────────────────────────────────────────────
# Disabled by default — enable per deployment
casehub.iot.homeassistant.enabled=false
casehub.iot.openhab.enabled=false

# ─── State History Retention ─────────────────────────────────────────────────
casehub.iot.webapp.state-history.retention-days=30
casehub.iot.webapp.state-history.purge-interval=PT1H

# ─── Connector stubs (dev mode only — no real Twilio/WhatsApp in local dev) ──
%dev.casehub.connectors.twilio.account-sid=dev-sid
%dev.casehub.connectors.twilio.auth-token=dev-token
%dev.casehub.connectors.twilio.from=+10000000000
%dev.casehub.connectors.whatsapp.phone-number-id=dev-phone
%dev.casehub.connectors.whatsapp.api-token=dev-token

# ─── Tenancy ─────────────────────────────────────────────────────────────────
casehub.iot.tenancy-id=default-tenant

# ─── Quinoa (TypeScript frontend) ────────────────────────────────────────────
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.18.1
quarkus.quinoa.package-manager-command.install=install

# Bean discovery for engine-queue (no Jandex index in jar)
quarkus.index-dependency.engine-queue.group-id=io.casehub
quarkus.index-dependency.engine-queue.artifact-id=casehub-engine-queue

# CBR triage thresholds
casehub.iot.triage.ai-resolution.min-similarity=0.85
casehub.iot.triage.ai-resolution.min-consistency=0.80
