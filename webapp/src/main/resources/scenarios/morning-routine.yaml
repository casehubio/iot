scenario: Morning Routine Demo
meta:
  title: Smart Home Morning Routine
  description: Watch the operational console respond to a morning device sequence
  area: iot
  labels: [demo, simulation]
  estimated: 2m

sections:
  - title: Wake Up
    content:
      type: inline
      markdown: |
        Motion is detected in the hallway. The system recognises the morning
        pattern and begins adjusting devices automatically.
    steps:
      - delivery: simulated
        dataset: devices
        data:
          deviceId: presence-front-1
          present: true
          deviceClass: PRESENCE_SENSOR

  - title: Lights and Climate
    content:
      type: inline
      markdown: |
        The living room light turns on and the thermostat adjusts to the
        morning comfort temperature.
    steps:
      - delivery: simulated
        dataset: devices
        data:
          deviceId: light-living-1
          on: true
          deviceClass: LIGHT
      - delivery: simulated
        dataset: devices
        data:
          deviceId: thermostat-living-1
          targetTemperature: { value: 22, unit: CELSIUS }
          mode: HEAT
          deviceClass: THERMOSTAT
